name: Build KikoStart GRO

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux,   os: ubuntu-22.04,   artifact: KikoStartGRO-Linux }
          - { name: Windows, os: windows-latest, artifact: KikoStartGRO-Windows }
          - { name: macOS,   os: macos-latest,   artifact: KikoStartGRO-macOS }

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
            libxrandr-dev libxrender-dev libgl1-mesa-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DKG_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Ad-hoc sign (macOS)
        if: runner.os == 'macOS'
        run: |
          for f in $(find build/KikoStartGRO_artefacts -name "*.vst3" -o -name "*.component" -o -name "*.app"); do
            codesign --force --deep -s - "$f" || true
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            build/KikoStartGRO_artefacts/Release/VST3
            build/KikoStartGRO_artefacts/Release/AU
            build/KikoStartGRO_artefacts/Release/Standalone
            build/KikoStartGRO_artefacts/VST3
            build/KikoStartGRO_artefacts/AU
            build/KikoStartGRO_artefacts/Standalone
          if-no-files-found: error
